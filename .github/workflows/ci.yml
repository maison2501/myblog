name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: app_test
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      CI: "true"
      DATABASE_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:schema:load

      - name: Run tests
        run: bundle exec rspec

      # マイグレーションを最初から流して作った db/schema.rb が、コミットされているものと一致するか
      # （マイグレーションを書いたのに schema.rb を更新し忘れる、を防ぐ）
      - name: Migrations match db/schema.rb
        run: |
          bin/rails db:drop db:create db:migrate
          git diff --exit-code db/schema.rb

      - name: Print Gemfile.lock
        if: always()
        run: cat Gemfile.lock

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: RuboCop
        run: bin/rubocop -f github

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Brakeman（コードの脆弱性）
        run: bin/brakeman --no-pager --quiet

      - name: bundler-audit（脆弱性のある gem）
        run: bin/bundler-audit

  # Gemfile を変えたのに Gemfile.lock を更新し忘れていないか。
  # 古い場合は、作り直した Gemfile.lock をログに出す（手元で bundle install できないときはそれをコピーする）
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Gemfile.lock is up to date
        run: |
          bundle lock --print > /tmp/Gemfile.lock.new
          if ! diff -u Gemfile.lock /tmp/Gemfile.lock.new; then
            echo "::error::Gemfile.lock が Gemfile と合っていません。bundle install して Gemfile.lock をコミットしてください"
            echo "=====BEGIN Gemfile.lock"
            cat /tmp/Gemfile.lock.new
            echo "=====END"
            exit 1
          fi

  cdn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: CDN の integrity（SRI ハッシュ）が実物と一致するか
        run: .github/scripts/check-cdn-integrity.sh
